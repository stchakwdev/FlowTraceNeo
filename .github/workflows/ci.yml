# Typecheck and build run on Vercel (see the build script), so failures and
# their logs show up in the Vercel deployment. GitHub only runs the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flowtrace
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: flowtrace/.bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test
        env:
          CI: 'true'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: flowtrace/test-results/
          if-no-files-found: ignore
