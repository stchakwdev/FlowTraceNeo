# Checks for the Cargo workspace under rust/. The web app has its own CI in ci.yml.
name: Rust

on:
  push:
    branches: [main]
    # A v* tag also runs the release job below. GitHub does not apply path filters to tag pushes.
    tags: ['v*']
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      # rust/fixtures are exported from these; the fixtures job below catches a missed re-export.
      - 'flowtrace/src/lib/ledger/**'
      - 'flowtrace/src/lib/demo/**'
      # crates/desktop/tests/screen_parity.rs reads the web routes and rail as text
      # (rust/docs/screen-parity.md).
      - 'flowtrace/src/routes/**'
      - 'flowtrace/src/routeTree.gen.ts'
      - 'flowtrace/src/lib/navigation.ts'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
      # rust/fixtures are exported from these; the fixtures job below catches a missed re-export.
      - 'flowtrace/src/lib/ledger/**'
      - 'flowtrace/src/lib/demo/**'
      # crates/desktop/tests/screen_parity.rs reads the web routes and rail as text
      # (rust/docs/screen-parity.md).
      - 'flowtrace/src/routes/**'
      - 'flowtrace/src/routeTree.gen.ts'
      - 'flowtrace/src/lib/navigation.ts'
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      # GPUI (desktop crate) builds against these; the list is the Ubuntu 24.04 one at
      # https://gpui-kit.com/docs/installation without WebKit and ALSA, which only
      # gpui-shell and the speech feature need. See rust/docs/adr/0002-gpui-spacetime.md.
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev

      # Reads rust/rust-toolchain.toml. Caching is left to rust-cache below.
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          rust-src-dir: rust
          cache: false

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust

      - name: Format, lint and test
        run: cargo fmt --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo test --workspace --locked

  # The rust/tools unit tests (bun test), then rust/fixtures must equal a fresh export from the
  # TS engine in flowtrace/src/lib/ledger (rust/fixtures/README.md). Needs no GPUI libraries and
  # no flowtrace/ install: the exporter imports flowtrace/src by relative path and its one npm
  # package from rust/tools/node_modules.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust/tools
    steps:
      - uses: actions/checkout@v5

      # bun.lock records no bun version; 1.4.2 is the version that wrote it.
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install the fixture tools
        run: bun install --frozen-lockfile

      - name: Unit tests of the tools
        run: bun test

      - name: Export twice and compare with rust/fixtures
        run: bun run check

  # Release archives for a v* tag: rust/tools/release.sh on Linux and macOS, uploaded as workflow
  # artifacts only. No GitHub Release, no publish to maincloud (rust/docs/module-release.md).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libfontconfig-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          rust-src-dir: rust
          cache: false

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rust

      - name: Build the release archive
        run: tools/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: flowtrace-books-${{ github.ref_name }}-${{ runner.os }}
          path: rust/dist/
          if-no-files-found: error
