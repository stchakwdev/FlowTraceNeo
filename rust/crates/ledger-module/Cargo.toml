[package]
name = "ledger-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The wasm module the SpacetimeDB host loads. It stays a workspace member, so the workspace
# checks build, lint and unit-test it on the host target too; see README.md for the wasm build.
# `rlib` as well, so ledger-client reuses the row structs and `codec` on the host.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ledger-core = { path = "../ledger-core" }
serde.workspace = true
serde_json.workspace = true
spacetimedb.workspace = true
thiserror.workspace = true

[lints]
workspace = true
