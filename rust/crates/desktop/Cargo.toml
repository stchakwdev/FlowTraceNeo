[package]
name = "desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The library holds the backend, theme, view models and screens so they are unit-tested; the
# binary only starts the app. See README.md for the module layout.
[lib]
name = "desktop"
path = "src/lib.rs"

[[bin]]
name = "desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
# The platform config dir for flowtrace-books/config.toml (README.md, Configuration).
dirs = "6.0"
# Brings gpui-pre =0.3.9 (re-exported as gpui_kit::*), gpui-component and the default assets.
gpui-kit.workspace = true
ledger-core = { path = "../ledger-core" }
# The live backend (U10): the ledger module over SpacetimeDB.
ledger-client = { path = "../ledger-client" }
# The proof record types (`transparency::types::NewVerification`) the backend sends to
# `create_verification` (rust/docs/adr/0004-transparency-tables.md).
ledger-module = { path = "../ledger-module" }
serde.workspace = true
serde_json.workspace = true
# Checks the proofs Worker's hash of an upload against the file's own (`src/proofs.rs`).
sha2.workspace = true
# `Identity` for the member row the in-process backend runs the module's proof rules as.
spacetimedb.workspace = true
thiserror.workspace = true
toml = "0.8"
# HTTPS to the proofs Worker (`src/proofs.rs`). The workspace had no HTTP client: the SpacetimeDB
# SDK only speaks WebSocket and GPUI's http_client trait has no implementation in gpui-pre. ureq is
# blocking and small (rustls, no async runtime); calls run on GPUI's background executor.
ureq = "3.1"
# Fresh ids for an organisation created in the app, as the TS module's `crypto.randomUUID()`
# (spacetimedb/src/index.ts, envFor).
uuid = { version = "1.28", features = ["v4"] }

[lints]
workspace = true
