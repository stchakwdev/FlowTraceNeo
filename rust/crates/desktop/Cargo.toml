[package]
name = "desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The product entry point (src/main.rs) stays a stub until U1. The F3 spike is a
# second binary that U1 can delete with its folder; see docs/adr/0002-gpui-spacetime.md.
[[bin]]
name = "desktop"
path = "src/main.rs"

[[bin]]
name = "desktop-spike"
path = "src/bin/desktop-spike/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
# Brings gpui-pre =0.3.9 (re-exported as gpui_kit::*), gpui-component and the default assets.
gpui-kit.workspace = true
spacetimedb-sdk.workspace = true

[lints]
workspace = true
