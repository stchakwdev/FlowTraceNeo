[workspace]
resolver = "2"
members = [
    "crates/ledger-core",
    "crates/ledger-module",
    "crates/ledger-client",
    "crates/desktop",
]
# The F3 spike module builds to wasm through the spacetime CLI and is not part of the
# workspace checks; see docs/adr/0002-gpui-spacetime.md.
exclude = ["spikes/stdb-spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
repository = "https://github.com/stchakwdev/FlowTraceNeo"
publish = false

# Shared dependency versions. Crates opt in with `name.workspace = true`:
# thiserror in libraries, anyhow in the desktop binary only.
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# UI and backend stack chosen in docs/adr/0002-gpui-spacetime.md.
# gpui-kit pins its GPUI snapshot itself (gpui-pre =0.3.9, wayland and x11 both on):
# https://gpui-kit.com/docs/installation
gpui-kit = "0.7.3"
# Rust client SDK at the server's 2.12 line: https://spacetimedb.com/docs/clients/rust
spacetimedb-sdk = "2.12.0"
# Server module crate, pinned to the server's 2.12.0: https://spacetimedb.com/docs/quickstarts/rust/
spacetimedb = "=2.12.0"
async-channel = "2.5"

# Every crate inherits these with `[lints] workspace = true`.
# Test modules opt out of unwrap_used / expect_used with a module-level
# `#![expect(..., reason = "...")]`; see crates/ledger-core/tests/money.rs.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Line tables only in dev builds: ADR 0002 measured the GPUI desktop link peak at 3.3 GiB with
# full debug info and 1.7 GiB with this, and the debug binary at 777 MiB versus 303 MiB.
[profile.dev]
debug = "line-tables-only"
